<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" fill="none">
<defs>
  <filter id="glow-hub" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="11" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-node" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="atmo-orange" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#E8187C" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#E8187C" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="atmo-blue" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#0022AA" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#0022AA" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fade-left" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"  stop-color="black" stop-opacity="1"/>
    <stop offset="40%" stop-color="black" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Atmósferas -->
<ellipse cx="640" cy="315" rx="275" ry="255" fill="url(#atmo-orange)"/>
<ellipse cx="520" cy="450" rx="190" ry="165" fill="url(#atmo-blue)"/>

